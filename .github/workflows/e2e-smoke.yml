# Chạy nhóm @smoke của bộ automation test (API + Chromium) mỗi lần push / mở PR vào main.
# Hạ tầng giống máy local: MySQL + MinIO bằng docker-compose.local.yml, backend chạy jar profile `local`,
# frontend do Playwright tự bật (webServer: pnpm --dir ../frontend dev).
name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cài pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Cài Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            automation/pnpm-lock.yaml

      - name: Tạo file môi trường từ mẫu
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Dựng MySQL + MinIO
        run: docker compose -f docker-compose.local.yml --env-file backend/.env up -d --wait

      - name: Build backend
        working-directory: backend
        run: mvn -q -B "-Djooq.codegen.skip=true" -pl app -am package -DskipTests

      - name: Chạy backend (profile local) và chờ sẵn sàng
        run: |
          nohup java -jar backend/app/target/aeoc-backend.jar > backend-run.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9500/api/v3/api-docs || true)
            if [ "$code" = "200" ]; then echo "backend sẵn sàng sau $((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "Backend không lên sau 180s"; tail -80 backend-run.log; exit 1

      - name: Cài phụ thuộc frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cài phụ thuộc automation + Chromium
        working-directory: automation
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Chạy nhóm @smoke (api + chromium)
        working-directory: automation
        run: pnpm test:smoke --project=api --project=chromium

      - name: Sinh báo cáo Allure
        if: always()
        working-directory: automation
        run: pnpm allure:generate || true

      - name: Tải lên báo cáo Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            automation/playwright-report/
            automation/playwright-report-stock/
          retention-days: 14

      - name: Tải lên kết quả Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            automation/allure-results/
            automation/allure-report/
          retention-days: 14

      - name: Tải lên log backend khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend-run.log
          retention-days: 7
