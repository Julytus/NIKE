# Chạy nhóm @smoke của bộ automation test trên đủ 5 project (api, chromium, firefox, webkit, mobile-chrome) mỗi lần
# push lên bất kỳ nhánh nào (plan ci-bao-cao §5.3). Commit chỉ sửa tài liệu thì bỏ qua (paths-ignore).
# Không chạy theo pull_request: check của commit đã hiện trên PR, tránh chạy hai lần cho cùng một commit.
# Hạ tầng dựng bằng composite action .github/actions/setup-sut; frontend chạy bản build (vite preview).
name: E2E smoke

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'plan/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (5 project)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      TZ: Asia/Ho_Chi_Minh
      E2E_FRONTEND: preview
      E2E_REPORT_TAG: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Dựng SUT
        uses: ./.github/actions/setup-sut
        with:
          browsers: chromium firefox webkit

      - name: Chạy nhóm @smoke (5 project × 2 pha)
        working-directory: automation
        run: pnpm test:smoke

      # Các bước báo cáo luôn chạy (kể cả khi test đỏ); thiếu đầu vào thì cảnh báo, không làm đỏ thêm bước khác.
      - name: Cảnh báo không có blob report
        if: always() && hashFiles('automation/blob-report/**/*.zip') == ''
        run: echo "::warning::Không có blob report — bỏ qua bước gộp báo cáo (test không chạy được?)"

      - name: Gộp báo cáo HTML hai pha
        if: always() && hashFiles('automation/blob-report/**/*.zip') != ''
        working-directory: automation
        run: pnpm report:all

      - name: Bảng số liệu → job summary
        if: always() && hashFiles('automation/playwright-report-all/results.json') != ''
        working-directory: automation
        run: pnpm report:summary --title "Smoke"

      - name: Khôi phục lịch sử Allure
        if: always() && hashFiles('automation/allure-results/*-result.json') != ''
        uses: actions/cache/restore@v4
        with:
          path: automation/allure-report/history
          key: allure-history-smoke-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-history-smoke-${{ github.ref_name }}-
            allure-history-smoke-main-

      - name: Sinh báo cáo Allure
        if: always() && hashFiles('automation/allure-results/*-result.json') != ''
        working-directory: automation
        run: pnpm allure:generate --single-file --title "Smoke"

      - name: Lưu lịch sử Allure
        if: always() && hashFiles('automation/allure-report/history/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: automation/allure-report/history
          key: allure-history-smoke-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Tải lên báo cáo Playwright (gộp)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: automation/playwright-report-all/
          retention-days: 14

      - name: Tải lên báo cáo Allure (một file)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report
          path: automation/allure-report-single/
          retention-days: 14

      - name: Tải lên log backend khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend-run.log
          retention-days: 7
